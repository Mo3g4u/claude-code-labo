name: CI/CD Pipeline

on:
  pull_request:
    branches: [ develop ]
  push:
    branches: [ develop ]

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
        options: >-
          --health-cmd "curl -f http://localhost:8000" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Python dependencies
      run: |
        cd backend
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Setup DynamoDB Local table
      run: |
        aws dynamodb create-table \
          --table-name todos \
          --attribute-definitions \
            AttributeName=user_id,AttributeType=S \
            AttributeName=todo_id,AttributeType=S \
          --key-schema \
            AttributeName=user_id,KeyType=HASH \
            AttributeName=todo_id,KeyType=RANGE \
          --billing-mode PAY_PER_REQUEST \
          --endpoint-url http://localhost:8000 \
          --region us-east-1
      env:
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1

    - name: Run backend linting (ruff)
      run: |
        cd backend
        ruff check src/ tests/

    - name: Run backend formatting check (ruff)
      run: |
        cd backend  
        ruff format --check src/ tests/

    - name: Run backend type checking (mypy)
      run: |
        cd backend
        mypy src/ --ignore-missing-imports

    - name: Run backend tests
      run: |
        cd backend
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term-missing
      env:
        DYNAMODB_ENDPOINT: http://localhost:8000
        TABLE_NAME: todos
        AWS_ACCESS_KEY_ID: test
        AWS_SECRET_ACCESS_KEY: test
        AWS_DEFAULT_REGION: us-east-1

    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./backend/coverage.xml
        flags: backend
        name: backend-coverage

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend linting (ESLint)
      run: |
        cd frontend
        npm run lint

    - name: Run frontend type checking (TypeScript)
      run: |
        cd frontend
        npm run type-check

    - name: Run frontend tests
      run: |
        cd frontend
        npm run test:ci -- --coverage

    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./frontend/coverage/lcov.info
        flags: frontend
        name: frontend-coverage

  integration-tests:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      localstack:
        image: localstack/localstack:latest
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
          DEBUG: 1
          DATA_DIR: /tmp/localstack/data
          DOCKER_HOST: unix:///var/run/docker.sock
        options: >-
          --name localstack
          --health-cmd "curl -f http://localhost:4566/_localstack/health" 
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js  
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2

    - name: Install dependencies
      run: |
        cd backend && pip install -r requirements-dev.txt
        cd ../frontend && npm ci

    - name: Setup LocalStack resources
      run: |
        # LocalStack 初期化スクリプト実行
        cd localstack-init && chmod +x init.sh && ./init.sh

    - name: Build SAM application
      run: |
        cd backend
        sam build

    - name: Start SAM Local API
      run: |
        cd backend  
        sam local start-api --env-vars env.json --host 0.0.0.0 --port 3001 &
        sleep 30
      env:
        DOCKER_HOST: unix:///var/run/docker.sock

    - name: Run integration tests
      run: |
        # API エンドポイントの疎通確認
        curl -f http://localhost:3001/todos?user_id=test_user || exit 1
        
        # フロントエンド統合テスト実行
        cd frontend
        npm run test:integration
      env:
        VITE_API_BASE_URL: http://localhost:3001

  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

  build-validation:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Install SAM CLI
      uses: aws-actions/setup-sam@v2

    - name: Install dependencies
      run: |
        cd backend && pip install -r requirements-dev.txt
        cd ../frontend && npm ci

    - name: Build backend (SAM)
      run: |
        cd backend
        sam build --use-container

    - name: Build frontend (Vite)
      run: |
        cd frontend
        npm run build

    - name: Validate OpenAPI specification
      run: |
        npm install -g @apidevtools/swagger-parser
        swagger-parser validate api/openapi.yaml