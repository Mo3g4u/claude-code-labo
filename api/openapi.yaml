openapi: 3.0.0
info:
  title: Todo API
  description: Simple Todo Application API
  version: 1.0.0
  contact:
    name: Todo App Team
    email: todo-app@example.com

servers:
  - url: https://api.todo-app.local/dev
    description: Local development server (LocalStack)
  - url: https://api.todo-app.com/dev
    description: AWS development server

paths:
  /todos:
    get:
      summary: Get all todos
      description: Retrieve all todos for the authenticated user
      operationId: getTodos
      parameters:
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID to filter todos
        - name: completed
          in: query
          required: false
          schema:
            type: boolean
          description: Filter by completion status
      responses:
        '200':
          description: List of todos
          content:
            application/json:
              schema:
                type: object
                properties:
                  todos:
                    type: array
                    items:
                      $ref: '#/components/schemas/Todo'
                  count:
                    type: integer
                    description: Total number of todos
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    
    post:
      summary: Create a new todo
      description: Create a new todo item
      operationId: createTodo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTodoRequest'
      responses:
        '201':
          description: Todo created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /todos/{todo_id}:
    get:
      summary: Get a specific todo
      description: Retrieve a specific todo by ID
      operationId: getTodo
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
          description: Todo ID
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '200':
          description: Todo details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      summary: Update a todo
      description: Update an existing todo item
      operationId: updateTodo
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
          description: Todo ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTodoRequest'
      responses:
        '200':
          description: Todo updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Todo'
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete a todo
      description: Delete a specific todo
      operationId: deleteTodo
      parameters:
        - name: todo_id
          in: path
          required: true
          schema:
            type: string
          description: Todo ID
        - name: user_id
          in: query
          required: true
          schema:
            type: string
          description: User ID
      responses:
        '204':
          description: Todo deleted successfully
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    Todo:
      type: object
      properties:
        user_id:
          type: string
          description: User ID who owns the todo
        todo_id:
          type: string
          description: Unique identifier for the todo
        title:
          type: string
          description: Todo title
          maxLength: 100
        description:
          type: string
          description: Todo description
          maxLength: 500
        completed:
          type: boolean
          description: Whether the todo is completed
        priority:
          type: string
          enum: [low, medium, high]
          description: Todo priority level
        created_at:
          type: string
          format: date-time
          description: Creation timestamp
        updated_at:
          type: string
          format: date-time
          description: Last update timestamp
      required:
        - user_id
        - todo_id
        - title
        - completed
        - created_at
        - updated_at
      example:
        user_id: "user123"
        todo_id: "todo456"
        title: "Buy groceries"
        description: "Milk, eggs, bread"
        completed: false
        priority: "medium"
        created_at: "2023-12-01T10:00:00Z"
        updated_at: "2023-12-01T10:00:00Z"

    CreateTodoRequest:
      type: object
      properties:
        user_id:
          type: string
          description: User ID who owns the todo
        title:
          type: string
          description: Todo title
          maxLength: 100
        description:
          type: string
          description: Todo description
          maxLength: 500
        priority:
          type: string
          enum: [low, medium, high]
          description: Todo priority level
          default: medium
      required:
        - user_id
        - title
      example:
        user_id: "user123"
        title: "Buy groceries"
        description: "Milk, eggs, bread"
        priority: "medium"

    UpdateTodoRequest:
      type: object
      properties:
        user_id:
          type: string
          description: User ID who owns the todo
        title:
          type: string
          description: Todo title
          maxLength: 100
        description:
          type: string
          description: Todo description
          maxLength: 500
        completed:
          type: boolean
          description: Whether the todo is completed
        priority:
          type: string
          enum: [low, medium, high]
          description: Todo priority level
      required:
        - user_id
      example:
        user_id: "user123"
        title: "Buy groceries"
        description: "Milk, eggs, bread, cheese"
        completed: true
        priority: "high"

    Error:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code
        details:
          type: object
          description: Additional error details
      required:
        - error
        - code
      example:
        error: "Validation failed"
        code: "VALIDATION_ERROR"
        details:
          field: "title"
          message: "Title is required"

  responses:
    BadRequest:
      description: Bad request - invalid input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Invalid request parameters"
            code: "BAD_REQUEST"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Todo not found"
            code: "NOT_FOUND"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
            code: "INTERNAL_ERROR"